packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  # vitest 由 vite-plus 精确锁定为 4.1.11，此处仅为让 bench 文件能显式 import，
  # 版本必须与 vite-plus 内置版本一致。
  vitest: 4.1.11
  vite-plus: 0.3.1
  vue: 3.6.0-rc.8
  vue-router: 5.3.1
  pinia: 4.0.3
  "@vue/devtools-api": ^8.2.1
  pinia-plugin-persistedstate: 4.7.1
  "@tanstack/vue-query": 5.102.8
  reka-ui: 2.10.4
  ofetch: 1.5.1
  zod: 4.6.2
  katex: 0.18.7
  "@microsoft/signalr": 10.0.11
  vue-virtual-scroller: 3.0.5
  aplayer: 1.10.1
  dplayer: 1.27.1
  hls.js: 1.7.3
  unocss: 66.10.2
  "@unocss/preset-attributify": 66.10.2
  "@unocss/preset-typography": 66.10.2
  "@vitejs/plugin-vue": 6.0.8
  vite-plugin-pwa: 1.3.0
  "@vueuse/core": 14.4.0
  "@vueuse/integrations": 14.4.0
  dayjs: 1.11.23
  clsx: 2.1.1
  pino: 10.3.1
  zod-openapi: ^6.0.2
  knip: ^6.35.1
  "@unocss/preset-icons": 66.10.2
  "@iconify-json/fa": 1.2.2
  "@iconify-json/heroicons": ^1.2.3
  vitepress: 2.0.0-alpha.20
  workbox-window: 7.4.1
  "@milkdown/kit": 7.22.1
  remark-gfm: 4.0.1
  remark-parse: 11.0.0
  unified: 11.0.5
  "@types/mdast": 4.0.4
  "@milkdown/crepe": 7.22.1
  remark-math: 6.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  agent-browser: true
  vue-demi: true
